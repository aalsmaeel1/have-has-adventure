<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Grammar Adventure</title><style>
:root{--navy:#122342;--blue:#2563eb;--mint:#10b981;--gold:#f59e0b;--bg:#f3f7ff}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--navy)}header{background:linear-gradient(120deg,#13244a,#2159ac);color:white;padding:24px max(20px,calc((100vw - 1100px)/2));}h1{margin:0;font-size:clamp(27px,4vw,45px)}header p{margin:8px 0 0}.wrap{max-width:1100px;margin:auto;padding:20px}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.pill{background:white;padding:10px 17px;border-radius:30px;font-weight:800;box-shadow:0 2px 9px #12234212}.progress{height:12px;background:#dbe5f5;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#10b981,#3b82f6);width:0;transition:.3s}.nav{display:flex;gap:8px;overflow:auto;padding:15px 0}.nav button{white-space:nowrap}.btn,button{cursor:pointer;border:0;border-radius:13px;padding:12px 17px;font-size:16px;font-weight:750;background:#e2eaff;color:#143467}.btn:hover,button:hover{filter:brightness(.95)}button.active,.primary{background:var(--blue);color:white}.panel{background:white;border-radius:22px;padding:clamp(18px,3vw,32px);box-shadow:0 10px 30px #142e5812;margin:15px 0}.tag{font-size:13px;letter-spacing:.08em;font-weight:900;color:#2563eb;text-transform:uppercase}.big{font-size:clamp(24px,3vw,35px);font-weight:850;margin:8px 0 15px}.ar{direction:rtl;text-align:right;color:#475569;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tile{border:2px solid #e4ebf6;border-radius:18px;padding:18px;background:#fcfdff}.tile h3{margin:8px 0}.emoji{font-size:48px}.example{background:#eaf3ff;border-left:5px solid #3b82f6;padding:15px;border-radius:10px;font-size:clamp(18px,2.5vw,25px);font-weight:800;margin:14px 0}.good{color:#047857}.bad{color:#b91c1c}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#f2f6fd;border:2px solid #e0e9f8;font-size:19px}.choice:focus{outline:3px solid #93c5fd}input[type=text]{width:100%;padding:15px;border:2px solid #b8c9e5;border-radius:12px;font-size:20px;margin:8px 0}.feedback{min-height:45px;font-size:19px;font-weight:800;padding:10px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.muted{color:#64748b}.sentence{font-size:clamp(20px,3vw,29px);font-weight:800}.listen{background:#d1fae5;color:#065f46}.footer{text-align:center;color:#64748b;padding:30px}.hide{display:none}.wordbank{display:flex;gap:8px;flex-wrap:wrap}.wordbank button{font-size:19px}.answer{min-height:55px;border:2px dashed #a6bce0;border-radius:12px;padding:12px;margin:10px 0;font-size:20px}.mini{font-size:14px}.lesson-list{line-height:2;font-size:19px}.switch{display:flex;gap:8px;flex-wrap:wrap}.switch button{flex:1} .finish{background:linear-gradient(120deg,#e0f2fe,#dcfce7)}@media(max-width:600px){header{padding:22px}.wrap{padding:12px}.panel{padding:18px}.choice{font-size:17px}}
</style></head><body><header><h1>🏡 Family Grammar Adventure</h1><p>Learn • Listen • Read • Build • Play • Master | The verb HAVE</p></header><main class="wrap"><div class="stats"><span class="pill">⭐ Score: <span id="score">0</span></span><span class="pill">🔥 Streak: <span id="streak">0</span></span><span class="pill">🏆 Completed: <span id="completed">0</span></span></div><div class="progress"><div id="bar" class="bar"></div></div><nav id="nav" class="nav"></nav><section id="content" class="panel"></section></main><footer class="footer">TVTC Level 3 • Beginner-friendly interactive practice • Works offline • Audio uses device speech</footer><script>
const levels=['Welcome','Have / Has','Positive +','Negative −','Questions ?','Short Answers','Family Reading','Word Builder','Book Exercise B','Final Challenge'];let level=0,score=0,streak=0,done=new Set(),index=0,answered=false,attempts={},built=[];
const $=id=>document.getElementById(id);function speak(t){if(!('speechSynthesis'in window)){alert('Audio is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function say(t){return `<button class="listen" onclick="speak(${JSON.stringify(t).replace(/"/g,'&quot;')})">🔊 Listen</button>`}function update(){ $('score').textContent=score;$('streak').textContent=streak;$('completed').textContent=done.size+'/10';$('bar').style.width=(done.size*10)+'%';$('nav').innerHTML=levels.map((x,i)=>`<button class="${i===level?'active':''}" onclick="go(${i})">${done.has(i)?'✓ ':''}${i+1}. ${x}</button>`).join('')}function go(n){level=n;index=0;answered=false;built=[];update();render();window.scrollTo({top:0,behavior:'smooth'})}function win(){if(!done.has(level)){done.add(level);score+=20}update()}function next(){if(index<questions[level].length-1){index++;answered=false;built=[];render()}else{win();$('feedback').innerHTML='🎉 Level completed! Great work!';$('nextBtn').textContent='Next level →';$('nextBtn').onclick=()=>go(Math.min(level+1,9))}}function reward(ok){if(answered)return;answered=true;if(ok){score+=10;streak++;$('feedback').innerHTML='<span class="good">✅ Excellent! Correct answer. +10 ⭐</span>'}else{streak=0;$('feedback').innerHTML='<span class="bad">❌ Try again. Read the rule and check the correct form.</span>';answered=false}update()}
const questions={1:[['I ___ two sisters.','have',['has','have','having'],'I have two sisters.'],['She ___ one brother.','has',['have','has','do'],'She has one brother.'],['They ___ three cousins.','have',['has','have','does'],'They have three cousins.'],['My father ___ a brother.','has',['have','has','having'],'My father has a brother.'],['We ___ a big family.','have',['has','have','does'],'We have a big family.']],2:[['He ___ three brothers.','has',['have','has','does'],'He has three brothers.'],['I ___ a father.','have',['have','has','am'],'I have a father.'],['My parents ___ two children.','have',['has','have','is'],'My parents have two children.'],['Sara ___ a twin.','has',['has','have','do'],'Sara has a twin.']],3:[['She ___ have a grandfather.','doesn’t',['don’t','doesn’t','isn’t'],'She doesn’t have a grandfather.'],['I ___ have a brother.','don’t',['doesn’t','don’t','hasn’t'],'I don’t have a brother.'],['He doesn’t ___ a sister.','have',['has','have','having'],'He doesn’t have a sister.'],['They ___ have cousins.','don’t',['don’t','doesn’t','has'],'They don’t have cousins.']],4:[['___ you have two sisters?','Do',['Does','Do','Has'],'Do you have two sisters?'],['___ she have five cousins?','Does',['Do','Does','Has'],'Does she have five cousins?'],['Does he ___ a twin?','have',['have','has','having'],'Does he have a twin?'],['___ your parents have a daughter?','Do',['Do','Does','Has'],'Do your parents have a daughter?']],5:[['Do you have a brother? Yes, I ___.','do',['does','do','have'],'Yes, I do.'],['Does she have a sister? No, she ___.','doesn’t',['don’t','doesn’t','hasn’t'],'No, she doesn’t.'],['Does he have a son? Yes, he ___.','does',['do','does','has'],'Yes, he does.'],['Do they have a daughter? No, they ___.','don’t',['doesn’t','don’t','aren’t'],'No, they don’t.']],6:[['Omar has one sister. Does Omar have a sister?','Yes, he does.',['Yes, he does.','No, he doesn’t.','Yes, he has.'],'Omar has one sister.'],['Lina doesn’t have a brother. Does Lina have a brother?','No, she doesn’t.',['Yes, she does.','No, she doesn’t.','No, she don’t.'],'Lina doesn’t have a brother.'],['The children have two cousins. Do the children have cousins?','Yes, they do.',['Yes, they do.','Yes, they does.','No, they don’t.'],'The children have two cousins.']],9:[['He ___ two uncles.','has',['have','has','do'],'He has two uncles.'],['We ___ have a twin.','don’t',['doesn’t','don’t','has'],'We don’t have a twin.'],['___ she have a daughter?','Does',['Do','Does','Has'],'Does she have a daughter?'],['Does your dad ___ a brother?','have',['has','have','having'],'Does your dad have a brother?'],['My sister ___ a son.','has',['has','have','do'],'My sister has a son.'],['Do they have cousins? Yes, they ___.','do',['does','do','have'],'Yes, they do.'],['He doesn’t ___ a grandfather.','have',['has','have','had'],'He doesn’t have a grandfather.'],['___ you have a sister?','Do',['Do','Does','Has'],'Do you have a sister?']]};
const book=[['+ (he / three brothers)','He has three brothers.'],['− (she / a grandfather)','She doesn’t have a grandfather.'],['? (you / two sisters)','Do you have two sisters?'],['+ (I / a father)','I have a father.'],['− (you / a twin)','You don’t have a twin.'],['? (she / five cousins)','Does she have five cousins?']];
const wordQ=[['She has one brother.',['She','has','one','brother.']],['I don’t have a brother.',['I','don’t','have','a','brother.']],['Does she have a twin?',['Does','she','have','a','twin?']],['Do you have two sisters?',['Do','you','have','two','sisters?']],['He doesn’t have an aunt.',['He','doesn’t','have','an','aunt.']]];
function shell(tag,title,body){$('content').innerHTML=`<div class="tag">${tag}</div><div class="big">${title}</div>${body}<div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button onclick="go(Math.max(0,level-1))">← Previous</button><button id="nextBtn" class="primary" onclick="advance()">Continue →</button></div>`}function advance(){if([1,2,3,4,5,6,7,8,9].includes(level)){if(level===7||level===8||questions[level]){if(level===7?index<wordQ.length-1:level===8?index<book.length-1:index<questions[level].length-1){index++;answered=false;built=[];render()}else{win();go(Math.min(level+1,9))}}}else{win();go(level+1)}}function choices(){let q=questions[level][index];return `<div class="tag">Question ${index+1} / ${questions[level].length}</div><div class="example">${q[0]}</div>${say(q[3])}<div style="margin-top:14px">${q[2].map((v,i)=>`<button class="choice" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div><p class="ar">اختر الإجابة الصحيحة. استمع إلى الجملة، ثم حاول قراءتها بصوت مرتفع.</p>`}function pick(i){let q=questions[level][index];if(answered)return;let ok=q[2][i]===q[1];reward(ok);if(ok){$('feedback').innerHTML+=`<div class="example">${q[3]}</div>`;speak(q[3])}}
function render(){let body='';if(level===0){body=`<p class="ar">مغامرة تعليمية متكاملة لتعلّم قاعدة <b>have / has</b> مع الإثبات والنفي والسؤال والإجابات القصيرة. تعلّم أولاً، ثم اجمع النجوم في كل مستوى. يمكن تكرار الاستماع والتدريبات.</p><div class="grid">${[['👨‍👩‍👧‍👦','Family','mother • father • parents'],['👧','Siblings','brother • sister • twin'],['👵','Relatives','grandmother • grandfather • aunt • uncle • cousin'],['👶','Children','son • daughter']].map(a=>`<div class="tile"><div class="emoji">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p>${say(a[2].replaceAll(' • ','. '))}</div>`).join('')}</div><div class="example">I have one sister. &nbsp; She has one brother.</div>${say('I have one sister. She has one brother.')}<p class="ar">ابدأ بالمفردات ثم انتقل تدريجيًا إلى بناء الجملة والتدريب والتقييم.</p>`;shell('Start your adventure','Meet the family!',body)}else if(level<=5){let lessons={1:['I / You / We / They → HAVE','He / She / It → HAS','I have a sister. / She has a brother.','مع I وYou وWe وThey نستخدم have. ومع He وShe وIt نستخدم has.'],2:['Positive sentence: Subject + have/has + family member','I have a sister.','He has three brothers.','الجملة المثبتة: الضمير ثم have أو has ثم اسم فرد العائلة.'],3:['Negative: I / You / We / They + don’t have','Negative: He / She / It + doesn’t have','She doesn’t have an aunt.','مهم: بعد doesn’t نستخدم have وليس has.'],4:['Do + I/you/we/they + have ... ?','Does + he/she/it + have ... ?','Does she have a twin?','مهم: السؤال يبدأ بـ Do أو Does، وبعد Does نستخدم have.'],5:['Do you have a brother? → Yes, I do. / No, I don’t.','Does she have a twin? → Yes, she does. / No, she doesn’t.','Does he have a son? → Yes, he does.','الإجابة القصيرة تستخدم do / does أو don’t / doesn’t، ولا نكرر have.']};let a=lessons[level];body=`<div class="grid"><div class="tile"><h3>📘 Rule</h3><div class="lesson-list">${a.slice(0,2).join('<br>')}</div></div><div class="tile"><h3>🗣️ Model sentence</h3><p class="sentence">${a[2]}</p>${say(a[2])}</div></div><p class="ar">${a[3]}</p><hr><h3>🎯 Practice and earn stars</h3>${choices()}`;shell('Grammar mission '+level,levels[level],body)}else if(level===6){body=`<div class="grid"><div class="tile"><div class="emoji">👦👧</div><h3>Omar's family</h3><p class="sentence">Omar has one sister. He doesn't have a twin.</p>${say("Omar has one sister. He doesn't have a twin.")}</div><div class="tile"><div class="emoji">👩‍👦</div><h3>Lina's family</h3><p class="sentence">Lina has a son. She doesn't have a brother.</p>${say("Lina has a son. She doesn't have a brother.")}</div><div class="tile"><div class="emoji">👨‍👩‍👧‍👦</div><h3>The family</h3><p class="sentence">The children have two cousins.</p>${say('The children have two cousins.')}</div></div><p class="ar">اقرأ الجمل، واستمع إليها، ثم أجب عن أسئلة الفهم.</p>${choices()}`;shell('Reading and comprehension','Read, listen and answer',body)}else if(level===7){let q=wordQ[index];body=`<div class="tag">Sentence ${index+1} / ${wordQ.length}</div><p class="ar">رتّب الكلمات لتكوين جملة صحيحة. استمع للجملة بعد ترتيبها.</p><div id="built" class="answer">${built.join(' ')||'Tap words to build a sentence...'}</div><div class="wordbank">${[...q[1]].reverse().map((w,i)=>`<button onclick="addWord(${i})" id="w${i}" ${built.includes(w)?'disabled':''}>${w}</button>`).join('')}</div><div class="actions"><button onclick="built=[];render()">↻ Reset</button><button class="primary" onclick="checkBuilt()">Check sentence ✓</button></div>`;shell('Spelling and sentence construction','Word Builder',body)}else if(level===8){let q=book[index];body=`<div class="tag">Textbook B • ${index+1} / 6</div><p class="ar">اكتب الجملة كاملة كما يطلب تمرين الكتاب. (+) إثبات، (−) نفي، (?) سؤال.</p><div class="example">${index+1}. ${q[0]}</div><input id="written" type="text" placeholder="Write the full English sentence" autocomplete="off"><div class="actions"><button class="primary" onclick="checkWritten()">Check my writing ✓</button><button onclick="showHint()">💡 Hint</button></div><p class="muted mini">Capital letters, apostrophes and punctuation are reviewed flexibly.</p>`;shell('Exact textbook exercise B','Write the full sentence',body)}else{body=`<p class="ar">اختبار نهائي شامل من 8 أسئلة. أكمل الاختبار للتحقق من فهم القاعدة.</p>${choices()}`;shell('Final assessment','Grammar Champion Challenge',body)}update()}
function addWord(i){let w=[...wordQ[index][1]].reverse()[i];built.push(w);render()}function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/does not/g,"doesn't").replace(/do not/g,"don't").replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim()}function checkBuilt(){let q=wordQ[index];let ok=norm(built.join(' '))===norm(q[0]);reward(ok);if(ok)speak(q[0])}function checkWritten(){let q=book[index];let value=$('written').value;let ok=norm(value)===norm(q[1]);reward(ok);if(ok){$('feedback').innerHTML+=`<div class="example">${q[1]}</div>`;speak(q[1])}else{$('feedback').innerHTML+=`<p class="mini">Hint: ${q[1].split(' ').slice(0,2).join(' ')} ...</p>`}}function showHint(){$('feedback').innerHTML=`💡 Start with: ${book[index][1].split(' ').slice(0,2).join(' ')} ...`}
render();</script></body></html>
