:root{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#172c50;background:#edf5ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#d5f8ef,transparent 35%),radial-gradient(circle at top right,#ffe3c7,transparent 40%),#edf5ff;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-weight:900;font-size:clamp(22px,4vw,34px)}.pill{background:white;border-radius:100px;padding:9px 15px;font-weight:800;box-shadow:0 5px 18px #223c6220}.panel{background:#fff;border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 18px 50px #23446c20;margin-top:20px}.hero{text-align:center}.hero h1{font-size:clamp(32px,6vw,55px);margin:8px}.muted{color:#687c98}.btn{border:0;border-radius:16px;background:#176cda;color:white;font-weight:850;padding:15px 24px;box-shadow:0 5px 0 #0b4eae;transition:.12s}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0b4eae}.btn.alt{background:#ffad35;color:#553000;box-shadow:0 5px 0 #ce7b13}.btn.ghost{background:#eaf1ff;color:#22548e;box-shadow:none}.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.stage{border-radius:20px;background:#f0f6ff;padding:16px 8px;text-align:center}.stage b{display:block;font-size:27px}.stage small{font-weight:750}.photos{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.photo{width:min(100%,270px);height:225px;object-fit:cover;border-radius:20px;border:5px solid white;box-shadow:0 9px 30px #2b48663b}.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{border:3px solid #e6efff;background:#fff;border-radius:17px;padding:6px;min-height:130px}.tile img{width:100%;height:95px;object-fit:cover;border-radius:12px}.tile span{display:block;font-weight:800;margin:6px}.question{font-size:clamp(22px,3vw,32px);font-weight:850;text-align:center;margin:16px 0}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:24px}.option{border:3px solid #e0eaff;background:#f7faff;color:#20395e;border-radius:17px;padding:18px 12px;font-size:clamp(17px,2.5vw,24px);font-weight:800;min-height:75px}.option:hover,.tile:hover{border-color:#52a4ff}.option.good{background:#d8f9e8;border-color:#15a36a}.option.bad{background:#ffe1e3;border-color:#e34d62}.bar{height:13px;border-radius:20px;background:#e6eff9;overflow:hidden;margin-top:18px}.bar>div{height:100%;background:linear-gradient(90deg,#18b6a1,#1c75e5);transition:width .2s}.feedback{padding:17px;border-radius:16px;margin-top:18px;font-size:19px;font-weight:800;text-align:center}.feedback.good{background:#d9f8e6;color:#116c47}.feedback.bad{background:#ffebd7;color:#934a11}.typebox{width:min(100%,420px);display:block;margin:20px auto;border:3px solid #a7c9f6;border-radius:16px;padding:17px;font-size:26px;text-align:center;outline:none}.typebox:focus{border-color:#176cda}.stat{font-size:clamp(45px,8vw,80px);font-weight:950;color:#176cda}.review{border:1px solid #dce6f4;border-radius:12px;padding:12px;margin:8px 0}.hidden{display:none!important}.small{font-size:14px}.center{text-align:center}@media(max-width:600px){.stages{grid-template-columns:repeat(2,1fr)}.photo-grid{grid-template-columns:repeat(3,1fr)}.tile img{height:75px}.options{grid-template-columns:1fr}.panel{border-radius:20px}.photo{height:190px}}
