<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Have & Has Adventure</title><style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(130deg,#dff6ff,#fff0ca);color:#17345b}.wrap{max-width:900px;margin:24px auto;padding:20px}.panel{background:white;border-radius:24px;padding:28px;box-shadow:0 12px 35px #17345b22}h1{text-align:center;color:#1765c1;font-size:clamp(32px,6vw,56px)}.sub{text-align:center;font-size:21px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:bold}.badge{background:#e4f3ff;padding:12px 18px;border-radius:20px}.bar{height:14px;background:#e8eef5;border-radius:20px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#2cae80;width:0;transition:.3s}.question{text-align:center;background:#f2f8ff;padding:25px;border-radius:18px;font-size:clamp(25px,4vw,38px);font-weight:bold;margin:20px 0}.prompt{text-align:center;font-size:23px}button{font-family:inherit;cursor:pointer}.option{display:block;width:100%;margin:12px 0;padding:19px;text-align:left;font-size:24px;border:3px solid #d4e3f2;background:white;border-radius:15px}.option:hover{background:#edf8ff}.option.correct{border-color:#22a66c;background:#e8fff2}.option.wrong{border-color:#e05b65;background:#fff0f0}.action{background:#1765c1;color:white;border:0;border-radius:14px;padding:17px 25px;font-size:23px;font-weight:bold;margin-top:15px;width:100%}.feedback{padding:18px;background:#f5f8fd;border-radius:15px;font-size:22px;margin-top:15px}.hidden{display:none}.small{font-size:17px;color:#49617c;text-align:center}.emoji{text-align:center;font-size:65px;margin:12px}.footer{text-align:center;margin-top:18px;color:#526b84}@media(max-width:600px){.panel{padding:17px}.wrap{padding:8px}.option{font-size:20px}}</style></head><body><div class="wrap"><div class="panel"><h1>🎒 HAVE & HAS ADVENTURE 🏆</h1><p class="sub">Learn • Play • Speak • Win!</p><div id="game"><div class="top"><span class="badge" id="level"></span><span class="badge" id="count"></span><span class="badge" id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="emoji" id="emoji"></div><p class="prompt" id="prompt"></p><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="action hidden">Next ➜</button></div><div id="finish" class="hidden" style="text-align:center"><div style="font-size:75px">🏆</div><h2>Mission Complete!</h2><h2 id="result"></h2><p id="message" style="font-size:23px"></p><button class="action" onclick="restart()">🔄 Play Again</button></div><p class="footer">Teacher tip: Read each question aloud. Ask students to say the full sentence before selecting.</p></div></div><script>const q=[
["Warm-up","👤","Choose the correct word.","I ___ a book.",["have","has","having"],0,"I + have"],
["Warm-up","👧","Choose the correct word.","She ___ a bag.",["have","has","haves"],1,"She + has"],
["Positive","👫","Complete the sentence.","They ___ two pens.",["has","have","does"],1,"They + have"],
["Positive","🚲","Complete the sentence.","He ___ a bike.",["have","has","do"],1,"He + has"],
["Negative","🚗","Choose the negative sentence.","I have a car.",["I doesn't have a car.","I don't have a car.","I not has a car."],1,"I + don't + have"],
["Negative","🐱","Choose the negative sentence.","She has a cat.",["She doesn't have a cat.","She don't has a cat.","She doesn't has a cat."],0,"She + doesn't + have. Never 'doesn't has'."],
["Questions","✏️","Make a Yes/No question.","___ you have a pencil?",["Does","Has","Do"],2,"Do + you + have ...?"],
["Questions","📱","Make a Yes/No question.","___ he have a phone?",["Does","Do","Has"],0,"Does + he + have ...?"],
["Short Answers","📚","Choose the short answer: YES.","Do they have books?",["Yes, they do.","Yes, they have.","Yes, they does."],0,"Do they ...? Yes, they do."],
["Short Answers","🚲","Choose the short answer: NO.","Does she have a bike?",["No, she don't.","No, she doesn't.","No, she hasn't."],1,"Does she ...? No, she doesn't."],
["Final Boss","🏆","Find the correct negative sentence.","He has a pen.",["He doesn't has a pen.","He don't have a pen.","He doesn't have a pen."],2,"He + doesn't + have"],
["Final Boss","🎒","Choose the correct question.","Ask about her bag.",["Does she have a bag?","Do she has a bag?","Does she has a bag?"],0,"Does + she + have + a bag?"]];let index=0,points=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;let a=q[index];el('level').textContent='Level: '+a[0];el('count').textContent='Question '+(index+1)+' / '+q.length;el('score').textContent='Score: '+points;el('fill').style.width=((index+1)/q.length*100)+'%';el('emoji').textContent=a[1];el('prompt').textContent=a[2];el('question').textContent=a[3];el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('options').innerHTML='';a[4].forEach((v,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'.  '+v;b.onclick=()=>choose(i);el('options').appendChild(b)})}function choose(i){if(answered)return;answered=true;let a=q[index],correct=i===a[5];if(correct)points++;[...el('options').children].forEach((b,j)=>{b.disabled=true;if(j===a[5])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('score').textContent='Score: '+points;el('feedback').innerHTML=(correct?'✅ Excellent!':'💡 Keep learning!')+'<br><strong>Rule:</strong> '+a[6];el('feedback').classList.remove('hidden');el('next').textContent=index===q.length-1?'See My Result 🏆':'Next Challenge ➜';el('next').classList.remove('hidden')}el('next').onclick=()=>{index++;if(index===q.length){el('game').classList.add('hidden');el('finish').classList.remove('hidden');el('result').textContent=points+' / '+q.length;el('message').textContent=points>=10?'Excellent! You mastered the challenge!':points>=7?'Good job! Practice once more.':'Keep practicing. You can do it!'}else render()};function restart(){index=0;points=0;el('finish').classList.add('hidden');el('game').classList.remove('hidden');render()}render();</script></body></html>
